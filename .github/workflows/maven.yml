# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - README.md
      - 'images/**'
  pull_request:
    branches: [ "*" ]
    paths-ignore:
      - README.md
      - 'images/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Get Project Version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression="project.version" -DforceStdout -q)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Project Version
        id: set_version
        env:
          BASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          # If PR, use source branch name; else use current branch name.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          BRANCH=$(echo "$BRANCH" | tr '/' '-')
          
          VERSION="$BASE_VERSION-$BRANCH-$SHORT_SHA"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B package

      - name: Upload JAR file
        uses: actions/upload-artifact@v5
        with:
          name: displayentityutils-${{ steps.set_version.outputs.version}}
          path: plugin/target/*.jar
